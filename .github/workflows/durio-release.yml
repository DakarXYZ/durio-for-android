name: durio release

# Signed release APKs (arm64-v8a, armeabi-v7a, x86_64 and universal, AN-41) in GitHub Releases with update.json for the in-app update check
# (plan AN-14, AN-18, O2). Runs on a version tag, e.g. v1.8.1. AGPL: the release links to the
# source of its tag.
#
# Secrets: DURIO_KEYSTORE_BASE64, DURIO_KEYSTORE_PASSWORD, DURIO_KEY_ALIAS, DURIO_KEY_PASSWORD,
# DURIO_GOOGLE_SERVICES_JSON_BASE64 (release Firebase config). Variables (optional):
# DURIO_DEFAULT_SERVER (prefilled on the login screen), DURIO_LINK_HOST (App Links host, AN-13).

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Signed APK to GitHub Releases
    if: github.repository_owner != 'stoatchat'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: No hard-coded upstream hosts
        run: bash scripts/check-upstream-hosts.sh

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Signing key and Firebase config
        env:
          KEYSTORE_BASE64: ${{ secrets.DURIO_KEYSTORE_BASE64 }}
          GOOGLE_SERVICES_BASE64: ${{ secrets.DURIO_GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "DURIO_KEYSTORE_BASE64 is not set"; exit 1; }
          test -n "$GOOGLE_SERVICES_BASE64" || { echo "DURIO_GOOGLE_SERVICES_JSON_BASE64 is not set"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "$GOOGLE_SERVICES_BASE64" | base64 -d > app/google-services.json
          echo "DURIO_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          DURIO_KEYSTORE_PASSWORD: ${{ secrets.DURIO_KEYSTORE_PASSWORD }}
          DURIO_KEY_ALIAS: ${{ secrets.DURIO_KEY_ALIAS }}
          DURIO_KEY_PASSWORD: ${{ secrets.DURIO_KEY_PASSWORD }}
          DURIO_DEFAULT_SERVER: ${{ vars.DURIO_DEFAULT_SERVER }}
          DURIO_LINK_HOST: ${{ vars.DURIO_LINK_HOST }}
        run: ./gradlew --no-daemon :app:assembleRelease

      # One APK per ABI plus the universal one (AN-41); update.json lists them all and the
      # in-app check (AN-18) picks the device's ABI, else the universal APK
      - name: Verify signatures, alignment, size; hashes and update manifest
        run: |
          build_tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          out=app/build/outputs/apk/release
          mkdir -p dist

          badging=$("$build_tools/aapt2" dump badging "$out/app-universal-release.apk" | head -n 1)
          version_code=$(sed -E "s/.*versionCode='([0-9]+)'.*/\1/" <<<"$badging")
          version_name=$(sed -E "s/.*versionName='([^']+)'.*/\1/" <<<"$badging")
          test "v$version_name" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME does not match versionName $version_name"; exit 1; }
          test $((version_code % 10)) -eq 0 || { echo "Universal versionCode $version_code must end in 0"; exit 1; }

          entries=""
          for abi in arm64-v8a armeabi-v7a x86_64 universal; do
            apk="$out/app-$abi-release.apk"
            "$build_tools/apksigner" verify --print-certs "$apk"
            abi_code=$("$build_tools/aapt2" dump badging "$apk" | head -n 1 | sed -E "s/.*versionCode='([0-9]+)'.*/\1/")
            case $abi in armeabi-v7a) offset=1 ;; arm64-v8a) offset=2 ;; x86_64) offset=3 ;; *) offset=0 ;; esac
            test "$abi_code" -eq $((version_code + offset)) || { echo "$abi: versionCode $abi_code, expected $((version_code + offset))"; exit 1; }
            file="durio-$version_name-$abi.apk"
            cp "$apk" "dist/$file"
            sha=$(sha256sum "dist/$file" | cut -d' ' -f1)
            entries="$entries${entries:+,
              }{ \"abi\": \"$abi\", \"file\": \"$file\", \"sha256\": \"$sha\" }"
          done
          BUILD_TOOLS="$build_tools" bash scripts/check-apk.sh --release dist/*.apk
          (cd dist && sha256sum *.apk > SHA256SUMS)

          # versionCode of the universal APK (base * 10): lower than every per-ABI APK of the
          # same version and higher than any APK of an older one
          cat > dist/update.json <<JSON
          {
            "versionCode": $version_code,
            "versionName": "$version_name",
            "apks": [
              $entries
            ]
          }
          JSON
          cat dist/update.json
          python3 -m json.tool dist/update.json > /dev/null

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "dur.io $GITHUB_REF_NAME" \
            --notes "Source code of this build: https://github.com/$GITHUB_REPOSITORY/tree/$GITHUB_REF_NAME (AGPL-3.0)"

      - name: Remove secrets
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks" app/google-services.json
