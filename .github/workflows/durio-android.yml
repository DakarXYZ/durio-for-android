name: durio android

# Build and unit tests of the dur.io fork (plan AN-14). Upstream's workflows are guarded to
# stoatchat; this one runs everywhere else.

on:
  push:
    branches: [dev, "durio/**"]
  pull_request:

concurrency:
  group: durio-android-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Debug build and unit tests
    if: github.repository_owner != 'stoatchat'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: No hard-coded upstream hosts
        run: bash scripts/check-upstream-hosts.sh

      - name: E2EE hygiene
        run: bash scripts/check-crypto-hygiene.sh

      - name: No Sentry
        run: |
          if grep -rn "io.sentry" --include=*.kt --include=*.kts --include=*.toml --include=*.xml app core gradle build.gradle.kts settings.gradle.kts; then
            echo "Sentry is off in our builds (plan AN-04)"
            exit 1
          fi

      - name: No secrets in git
        run: |
          if git ls-files | grep -E '(^|/)google-services\.json$|\.jks$|\.keystore$|(^|/)keystore\.properties$|\.aar$|\.so$'; then
            echo "Secrets must not be committed"
            exit 1
          fi

      # Report only (plan AN-14): upstream code and our earlier fork code are not ktlint-clean
      # yet (android_studio style from .editorconfig); make it blocking once fork/ is formatted
      - name: ktlint (fork code, report only)
        continue-on-error: true
        run: |
          curl -sSfL -o "$RUNNER_TEMP/ktlint" https://github.com/pinterest/ktlint/releases/download/1.5.0/ktlint
          chmod +x "$RUNNER_TEMP/ktlint"
          "$RUNNER_TEMP/ktlint" --relative "app/src/**/fork/**/*.kt" "core/**/src/**/fork/**/*.kt"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # The google-services plugin needs a config for the build; unit tests never talk to
      # Firebase, so a placeholder for our package names is enough. Real files never go to git.
      - name: Placeholder google-services.json
        run: bash scripts/ci-google-services.sh app/google-services.json

      # The E2EE core AAR comes from the durio-crypt GitHub Release (ivy repo in
      # settings.gradle.kts), checked against gradle/verification-metadata.xml (AN-20)
      - name: Build debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Unit tests
        # `test` covers :app and :core:crypto; allTests runs the KMP modules (:core:api, :core:model)
        run: ./gradlew --no-daemon test allTests

      - name: Test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          retention-days: 7
          path: |
            **/build/reports/tests/
            **/build/test-results/

      - name: Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          retention-days: 7
          path: app/build/outputs/apk/debug/*.apk
